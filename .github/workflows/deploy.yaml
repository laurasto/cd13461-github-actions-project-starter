# project yaml file for github actions training

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - "**/**.md"
      - 'LICENSE.txt'

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true
#  group: ${{ github.workflow }}-${{ github.ref }}
#  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write


jobs:
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      # Setup Node (version 18+)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: v24.16.0
      # Install all the dependencies needed. Use the cache to speed up the process
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install
      # Run all the linters
      - name: run javascript lint
        run: npm run js:lint
      # Run all the scripts in the folder script/**
      - name: run URL checker
        run: node ./script/url-checker.js


  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      PATH_PREFIX: /${{github.event.repository.name}}/
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      # Setup Node (version 18+) --> deprecated, so ignore
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: v24.16.0

      # Install all the dependencies needed. Use the cache to speed up the process
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
                    ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      # Setup pages
      - name: Configure pages
        uses: actions/configure-pages@v4
      # Use GitHub Actions artifacts to upload a zip file
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
        pages: write
        id-token: write

    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


  create_issue:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GH issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(date +'%Y-%m-%d') - Deployment: succeeded" \
            --body "URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"







